services:
  db:
    image: postgres:16
    container_name: personel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-servis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servispass}
      POSTGRES_DB: ${POSTGRES_DB:-servisdb}
      TZ: Europe/Istanbul
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servis} -d ${POSTGRES_DB:-servisdb}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: personel_redis
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../backend
    container_name: personel_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      TZ: Europe/Istanbul
      PORT: ${API_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AI_COPILOT_ENABLED: ${AI_COPILOT_ENABLED:-1}
      CAPACITY_BASELINE_ENABLED: ${CAPACITY_BASELINE_ENABLED:-1}
      CAPACITY_BASELINE_WINDOW_MINUTES: ${CAPACITY_BASELINE_WINDOW_MINUTES:-15}
      CAPACITY_BASELINE_WARN_RPM: ${CAPACITY_BASELINE_WARN_RPM:-300}
      CAPACITY_BASELINE_WARN_P95_MS: ${CAPACITY_BASELINE_WARN_P95_MS:-1200}
      CAPACITY_BASELINE_WARN_429_RATIO_PCT: ${CAPACITY_BASELINE_WARN_429_RATIO_PCT:-5}
      CAPACITY_BASELINE_WARN_INFLIGHT: ${CAPACITY_BASELINE_WARN_INFLIGHT:-60}
      CAPACITY_BASELINE_WARN_WS_CONNECTIONS: ${CAPACITY_BASELINE_WARN_WS_CONNECTIONS:-500}
      CAPACITY_BASELINE_WARN_EVENT_LOOP_LAG_MS: ${CAPACITY_BASELINE_WARN_EVENT_LOOP_LAG_MS:-250}
      EDGE_SECURITY_ENABLED: ${EDGE_SECURITY_ENABLED:-1}
      EDGE_SECURITY_HEADERS_ENABLED: ${EDGE_SECURITY_HEADERS_ENABLED:-1}
      EDGE_BLOCK_SUSPICIOUS_UA: ${EDGE_BLOCK_SUSPICIOUS_UA:-1}
      EDGE_BLOCK_TRACE_METHOD: ${EDGE_BLOCK_TRACE_METHOD:-1}
      EDGE_BLOCKED_UA_NEEDLES: ${EDGE_BLOCKED_UA_NEEDLES:-sqlmap,nikto,masscan,nmap,zgrab,acunetix,nessus}
      EDGE_SNAPSHOT_WINDOW_MINUTES: ${EDGE_SNAPSHOT_WINDOW_MINUTES:-60}
      EDGE_WARN_5XX_RATIO_PCT: ${EDGE_WARN_5XX_RATIO_PCT:-3}
      EDGE_WARN_429_RATIO_PCT: ${EDGE_WARN_429_RATIO_PCT:-5}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_STORE: "redis"
      GPS_THROTTLE_STORE: "redis"
      DATABASE_URL: postgresql://${POSTGRES_USER:-servis}:${POSTGRES_PASSWORD:-servispass}@db:5432/${POSTGRES_DB:-servisdb}?schema=public

      # M19 — learned route (OSRM map-matching)
      # Optional: only set when compose --profile osrm is used
      OSRM_URL: http://osrm:5000
      ROUTE_LEARN_ENABLED: ${ROUTE_LEARN_ENABLED:-0}
      ROUTE_LEARN_INTERVAL_MS: ${ROUTE_LEARN_INTERVAL_MS:-2000}

      # Optional solver service (compose --profile osrm)
      PLAN_SOLVER_URL: http://solver:8000
      # Container içinde kullanılacak flag
      PRISMA_DB_PUSH_FLAGS: "--accept-data-loss"
      FEATURE_CHECKIN: ${FEATURE_CHECKIN:-0}
      CHECKIN_DEDUPE_SEC: ${CHECKIN_DEDUPE_SEC:-60}

      TELEMATICS_ENABLED: ${TELEMATICS_ENABLED:-1}
      TELEMATICS_VENDOR_SHARED_SECRET: ${TELEMATICS_VENDOR_SHARED_SECRET:-dev_telematics_vendor_secret}
      TELEMATICS_RATE_LIMIT_WINDOW_MS: ${TELEMATICS_RATE_LIMIT_WINDOW_MS:-60000}
      TELEMATICS_RATE_LIMIT_MAX: ${TELEMATICS_RATE_LIMIT_MAX:-240}
      TELEMATICS_HISTORY_MIN_SEC: ${TELEMATICS_HISTORY_MIN_SEC:-30}
      TELEMATICS_HISTORY_MIN_METERS: ${TELEMATICS_HISTORY_MIN_METERS:-50}
      LOG_RETENTION_ENABLED: ${LOG_RETENTION_ENABLED:-1}
      API_REQUEST_RETENTION_DAYS: ${API_REQUEST_RETENTION_DAYS:-730}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-730}
      BACKUP_LOCAL_DIR: ${BACKUP_LOCAL_DIR:-/app/artifacts/backups}
      BACKUP_LOCAL_RETENTION_DAYS: ${BACKUP_LOCAL_RETENTION_DAYS:-730}
      BACKUP_DUMP_FORMAT: ${BACKUP_DUMP_FORMAT:-plain}
      LOG_RETENTION_INTERVAL_HOURS: ${LOG_RETENTION_INTERVAL_HOURS:-6}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-180}
      CHECKIN_EVENT_RETENTION_DAYS: ${CHECKIN_EVENT_RETENTION_DAYS:-180}
      GPS_POINT_RETENTION_DAYS: ${GPS_POINT_RETENTION_DAYS:-30}

    ports:
      - "${API_PORT:-3000}:3000"
    working_dir: /app/backend
    volumes:
      - ..:/app
      - /app/backend/node_modules

    # ÖNEMLİ: $ -> compose expand etmez, container shell expand eder
    command: ["sh", "-lc", "npm install && npx prisma generate && npx prisma db push ${PRISMA_DB_PUSH_FLAGS:-} && npm run seed && npm run dev"]
  osrm:
    profiles: ["osrm"]
    image: osrm/osrm-backend:latest
    container_name: personel_osrm
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
    command: osrm-routed --algorithm mld /data/turkey-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data

  solver:
    profiles: ["osrm"]
    build:
      context: ./solver
    container_name: personel_solver
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  pgdata:




