name: Vardis Verification Visibility

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: vardis-verification-visibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Canonical verification chain
        run: npm run verify:ci

      - name: Upload repo audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-audit-latest
          path: artifacts/repo-audit/repo_audit_latest.json
          if-no-files-found: error

      - name: Upload web lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-lint-latest
          path: artifacts/lint/web_lint_latest.txt
          if-no-files-found: error

  shareable-export:
    needs: repo-verification
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Export hygiene pack
        shell: pwsh
        run: ./tools/pack_m90_c7_export_package_hygiene.ps1 -RepoRoot ${{ github.workspace }}

      - name: Upload shareable export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shareable-export-evidence
          path: |
            artifacts/repo-audit/repo_audit_latest.json
            artifacts/shareable-export/servis-platform_shareable_*.zip
          if-no-files-found: error

  prisma-cross-platform:
    name: Prisma cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Restore generated-client cache by identity
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.prisma
          key: prisma-client-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/prisma/schema.prisma', 'backend/package-lock.json', 'backend/scripts/prisma_cross_platform_client_hardening_01.mjs') }}

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Canonical Prisma generation
        run: npm --prefix backend run prisma:generate

      - name: Canonical Prisma identity and integrity
        run: npm --prefix backend run prisma:verify

  prisma-container-parity:
    name: Prisma container parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build canonical backend container
        run: docker build --pull=false --tag servis-platform-prisma-hardening:ci --file backend/Dockerfile backend

      - name: Verify generated client inside container
        run: docker run --rm servis-platform-prisma-hardening:ci node scripts/prisma_cross_platform_client_hardening_01.mjs verify
